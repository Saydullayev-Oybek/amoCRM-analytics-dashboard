# amoCRM ETL uchun Airflow (LocalExecutor) — soddalashtirilgan compose.
# Servislar:
#   postgres      — Airflow'ning O'Z metadata bazasi (ichki, tegilmaydi)
#   analytics-db  — SIZNING analitika bazangiz (amoCRM ma'lumoti shu yerga yig'iladi)
#   airflow-init / webserver / scheduler
#   metabase-db   — Metabase'ning O'Z bazasi (dashboardlar, foydalanuvchilar)
#   metabase      — dashboard UI: http://localhost:3000
#
# DIQQAT — host nomlanishi:
#   * Airflow konteyneri ICHIDAN analytics-db'ga ulanish → host = "analytics-db", port 5432
#     (postgres_config.json shunga sozlangan).
#   * HOST kompyuterdan (Power BI, DBeaver, psql) ulanish → host = "localhost", port 5433.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # ▶ Trigger bosganda config formasi doim chiqsin (DAG'da params bo'lmasa ham) —
    # {"full_refresh": true} yuborish uchun.
    AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS: "true"
    # Bizning ETL uchun kerakli env:
    PYTHONPATH: /opt/airflow/project          # amocrm paketini import qilish uchun
    AMOCRM_CONFIG_DIR: /opt/airflow/config    # auth.json / postgres_config.json shu yerda
    DLT_DATA_DIR: /opt/airflow/dlt_data       # dlt state/loglar shu yerda saqlanadi
    DBT_PROFILES_DIR: /opt/airflow/dbt_project  # profiles.yml shu papkada (dbt uni shu yerdan o'qiydi)
  volumes:
    - ./dags:/opt/airflow/dags                                  # DAG fayllar
    - ./dlt_pipeline/amocrm:/opt/airflow/project/amocrm         # amocrm paketi (PYTHONPATH orqali)
    - ./auth.json:/opt/airflow/config/auth.json:ro             # amoCRM token (faqat o'qish)
    - ./postgres_config.json:/opt/airflow/config/postgres_config.json:ro  # analitika baza sozlamasi
    - ./logs:/opt/airflow/logs                                  # Airflow loglar
    - ./dlt_data:/opt/airflow/dlt_data                          # dlt working dir
    - ./dbt_project:/opt/airflow/dbt_project                    # dbt modellari + profiles.yml (yozish kerak: target/, logs/)
  depends_on:
    postgres:
      condition: service_healthy
    analytics-db:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  # SIZNING analitika bazangiz — amoCRM ma'lumoti shu yerga yig'iladi.
  analytics-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres          # postgres_config.json'dagi username bilan bir xil
      POSTGRES_PASSWORD: "admin"      # postgres_config.json'dagi password bilan bir xil
      POSTGRES_DB: amocrm           # postgres_config.json'dagi database bilan bir xil
    ports:
      - "5433:5432"                 # host'dan: localhost:5433 (Power BI, DBeaver, psql)
    volumes:
      - analytics-db-data:/var/lib/postgresql/data   # ma'lumot shu volume'da saqlanadi
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "amocrm"]
      interval: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # DB migratsiyasini bajaradi va admin foydalanuvchini yaratadi (bir marta).
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"                                            # UI: http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Metabase'ning O'Z bazasi — dashboardlar, so'rovlar, foydalanuvchilar shu yerda.
  # Alohida servis, chunki `postgres` (Airflow metadata) volume'i allaqachon
  # initsializatsiya qilingan → unga ikkinchi bazani init-skript bilan qo'shib
  # bo'lmaydi. Metabase'ning default H2'si ishlatilmaydi — u zaxiralashga yaroqsiz.
  metabase-db:
    image: postgres:16
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "metabase"]
      interval: 10s
      retries: 5
    restart: always

  # Dashboard UI. analytics-db'ni compose tarmog'ida "analytics-db:5432" deb
  # ko'radi (aynan dbt'ning `docker` targeti ishlatadigan manzil).
  metabase:
    image: metabase/metabase:latest
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      # Metabase saqlaydigan baza parollarini shifrlaydi. Qo'yilmasa ular app
      # DB'da ochiq matn bo'lib yotadi. Prod'da bu qiymat almashtirilsin.
      MB_ENCRYPTION_SECRET_KEY: "almashtiring-kamida-32-belgi-uzunlikdagi-sir"
    ports:
      - "3000:3000" # jamoa: http://<host-IP>:3000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s # JVM sekin ko'tariladi
    restart: always
    depends_on:
      metabase-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy

volumes:
  airflow-db:
  analytics-db-data:      # SIZNING analitika bazangiz ma'lumoti
  metabase-db-data:       # Metabase sozlamalari (dashboardlar shu yerda!)
